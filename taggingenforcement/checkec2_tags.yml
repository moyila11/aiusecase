---
- name: Quick EC2 tag check (use system-wide AWS CLI)
  hosts: localhost
  connection: local
  gather_facts: no
  become: true   # allows root execution if needed

  vars:
    aws_region: "us-east-1"
    instance_id: "i-0849caa4ca5955163"
    required_tags:
      - owner
      - environment
      - cost_center
    # Use system-wide AWS CLI path
    aws_cli_path: "/usr/local/bin/aws"

  tasks:
    - name: Verify AWS CLI binary exists and is executable
      become: yes 
      ansible.builtin.stat:
        path: "{{ aws_cli_path }}"
      register: aws_stat
      changed_when: false

    # - name: Fail if aws CLI binary not found
    #   become: yes
    #   ansible.builtin.fail:
    #     msg: "aws CLI not found at {{ aws_cli_path }}. Please verify the path or install awscli."
    #   when: not aws_stat.stat.exists or not aws_stat.stat.executable

    - name: Check AWS CLI version
      ansible.builtin.shell: |
        export PATH=$PATH:/usr/local/bin:/root/.local/bin
        aws --version
      args:
        executable: /bin/bash
      register: aws_version
      changed_when: false


    - name: Show AWS CLI version
      ansible.builtin.debug:
        var: aws_version.stdout

    - name: Get tag keys for this instance
      ansible.builtin.shell: >
        "{{ aws_cli_path }}" ec2 describe-tags
        --region {{ aws_region }}
        --filters "Name=resource-id,Values={{ instance_id }}"
        --query "Tags[].Key"
        --output text
      environment:
        PATH: /usr/local/bin:/usr/bin:/bin
      args:
        executable: /bin/bash
      register: tag_keys
      changed_when: false
      failed_when: tag_keys.rc != 0 and "'UnauthorizedOperation' not in tag_keys.stderr"

    - name: Friendly error if unauthorized to call DescribeTags
      ansible.builtin.fail:
        msg: >
          ❌ Unauthorized: AWS identity used by this controller/job
          cannot call ec2:DescribeTags. Add the correct IAM permissions.
      when: "'UnauthorizedOperation' in tag_keys.stderr"

    - name: Compute present tag keys
      ansible.builtin.set_fact:
        present_tag_keys: "{{ (tag_keys.stdout | default('')) | split() | default([]) }}"

    - name: Compute missing tags
      ansible.builtin.set_fact:
        missing: "{{ required_tags | difference(present_tag_keys | default([])) }}"

    - name: Show compliance result
      ansible.builtin.debug:
        msg: >
          ✅ Instance={{ instance_id }}
          Present={{ present_tag_keys }}
          Missing={{ missing }}
          Status={{ 'Compliant' if (missing|length)==0 else 'Non-compliant' }}
