---
- name: Quick EC2 tag check (AAP controller / localhost)
  hosts: localhost
  connection: local
  gather_facts: no
  become: true

  vars:
    aws_region: "us-east-1"
    instance_id: "i-0849caa4ca5955163"
    required_tags:
      - owner
      - environment
      - cost_center
    aws_candidates:
      - /var/lib/awx/.local/bin/aws
      - /usr/local/bin/aws
      - /root/.local/bin/aws
      - /usr/bin/aws
      - /bin/aws

  tasks:
    - name: Check candidate aws binary locations
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ aws_candidates }}"
      register: aws_stat
      changed_when: false
      run_once: true

    - name: Set aws_path fact from first existing candidate
      ansible.builtin.set_fact:
        aws_path: "{{ item.item }}"
      loop: "{{ aws_stat.results }}"
      when: item.stat.exists
      run_once: true

    - name: Fail early if aws CLI not found for the job runtime
      ansible.builtin.fail:
        msg: >
          aws CLI not found in AAP job environment. Candidate locations checked: {{ aws_candidates }}.
          Either make aws available to the awx/aap user (install system-wide or place in /var/lib/awx/.local/bin)
          or use the boto3/amazon.aws module instead.
      when: aws_path is not defined
      run_once: true

    - name: Run describe-tags (using discovered aws path)
      ansible.builtin.shell: |
        "{{ aws_path }}" ec2 describe-tags --region {{ aws_region }} --filters "Name=resource-id,Values={{ instance_id }}" --query "Tags[].Key" --output text
      environment:
        PATH: /var/lib/awx/.local/bin:/root/.local/bin:/usr/local/bin:/usr/bin:/bin
      args:
        executable: /bin/bash
      register: tag_keys
      changed_when: false
      failed_when: tag_keys.rc != 0 and "'UnauthorizedOperation' not in tag_keys.stderr"

    - name: Friendly error if unauthorized to call DescribeTags
      ansible.builtin.fail:
        msg: >
          Unauthorized: the AWS identity used by this controller/job is blocked from calling ec2:DescribeTags.
          Ask admins to attach/allow a role with ec2:DescribeTags (or attach a role to the controller instance),
          or provide an automation credential in AAP.
      when: "'UnauthorizedOperation' in tag_keys.stderr"

    - name: Compute present tag keys (safe)
      ansible.builtin.set_fact:
        present_tag_keys: "{{ (tag_keys.stdout | default('')) | split() | default([]) }}"

    - name: Compute missing tags
      ansible.builtin.set_fact:
        missing: "{{ required_tags | difference(present_tag_keys | default([])) }}"

    - name: Show compliance result
      ansible.builtin.debug:
        msg: "Instance={{ instance_id }} Present={{ present_tag_keys }} Missing={{ missing }} Status={{ 'Compliant' if (missing|length)==0 else 'Non-compliant' }}"
